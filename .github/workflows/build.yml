name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure Android SDK
        run: |
          set -e
          # 用 runner 预装的 SDK，不走 setup-android 那个 action
          if [ -z "$ANDROID_HOME" ]; then
            ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME = $ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Install platform 37 and build tools
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          echo "sdkmanager = $SDKMANAGER"
          "$SDKMANAGER" --version || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-37.0" \
            || "$SDKMANAGER" --channel=3 "platforms;android-37.0" \
            || "$SDKMANAGER" --channel=4 "platforms;android-37.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chaoxing-ax-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
